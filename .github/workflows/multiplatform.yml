name: multiplatform

# The desktop and iOS builds (docs 24/25). Separate from ci.yml on purpose: the APK's checks stay
# exactly what they were, and a red here says "the ports" rather than "the app".

on:
  push:
    branches: [main, multiplatform]
  pull_request:
  workflow_dispatch:

jobs:
  # The core with the features the APK does not build: the engine, its device output, the C ABI.
  core-features:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core_engine
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core_engine
          key: features
      # cpal's ALSA backend links libasound.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - run: cargo test --all-targets --features mock-env,engine,c-api,media-controls
      - run: cargo clippy --all-targets --features mock-env,desktop-audio,c-api,media-controls -- -D warnings

  # The shared Kotlin module's own tests, on the desktop JVM target.
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :shared:desktopTest --no-daemon

  # One package per host, as jpackage requires. Uploaded so a build can be tried without building.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core_engine -> target/desktop
          key: desktop
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config rpm
      # bash on every runner: PowerShell splits `-Prustify.desktop=true` at the dot.
      - shell: bash
        run: ./gradlew -Prustify.desktop=true :desktopApp:packageDistributionForCurrentOS --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: rustify-desktop-${{ runner.os }}
          path: desktopApp/build/compose/binaries/main/
          if-no-files-found: error

  # The core as an iOS static library and the Kotlin framework linked against it, for the simulator.
  # No app: that needs XcodeGen and signing (iosApp/project.yml).
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core_engine -> target/ios-build/iosArm64
            core_engine -> target/ios-build/iosSimulatorArm64
          key: ios
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - run: tools/ios/build-core.sh
      # Device first: linking a framework needs no signing, and it is the build an .ipa is made of.
      - run: ./gradlew :shared:linkDebugFrameworkIosArm64 :shared:linkDebugFrameworkIosSimulatorArm64 --no-daemon
