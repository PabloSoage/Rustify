[package]
name = "rustify_login"
# Follows the app's version, like the core's (one number for one release).
version = "5.0.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
description = "The desktop app's Spotify sign-in: the login page in the system's own webview, and the sp_dc cookie it leaves"
publish = false

# Its own root: not a member of anything, and nothing else builds it. The desktop build runs cargo
# here (desktopApp/build.gradle.kts, buildLoginHelper) and ships the binary next to the core.
[workspace]

[[bin]]
name = "rustify-login"
path = "src/main.rs"

[dependencies]
# The system's webview: WebView2 on Windows, WKWebView on macOS, WebKitGTK 4.1 on Linux. Nothing is
# bundled, which is the point against a Chromium of our own (~100 MB). On Linux it builds against
# libwebkit2gtk-4.1-dev and libgtk-3-dev.
wry = "0.57.1"
# The window. Without its default `dbus` feature, which only reads the desktop's colour scheme and
# would add libdbus to what the Linux build links.
tao = { version = "0.37.2", default-features = false, features = ["rwh_06", "x11"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# The panic hook answers `{"error":…}` and exits before the abort; nothing here catches an unwind.
panic = "abort"
