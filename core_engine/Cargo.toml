[package]
name = "core_engine"
version = "5.0.0"
edition = "2021"

[lib]
name = "core_engine"
# cdylib: the .so the NDK links into the APK — this is what ships.
# rlib:   lets tests and future ports (Windows/iOS, docs/windows/03 Phase 0) link against the core.
#         Without it there is no way to test the engine at all; see docs/stremio-core/PLAN-3.x.md §A0.
crate-type = ["cdylib", "rlib"]

[features]
# Exposes `env::mock::MockEnv` outside `cfg(test)`, for integration tests and host tooling.
# Unit tests do not need it: `mock` is also gated on `cfg(test)`.
mock-env = []
# The audio engine for platforms without Media3 (`src/engine/`, docs `24` §2): decode, convert, ring,
# and a null output the tests run against. Off for the APK — `cargo ndk build` passes no features, so
# the phone's `.so` carries none of it.
engine = ["dep:symphonia"]
# The engine plus a real device through cpal (WASAPI, ALSA/PipeWire, CoreAudio) and its JNI bridges
# for the desktop JVM app. What `desktopApp`'s build of the core turns on.
desktop-audio = ["engine", "dep:cpal"]
# The C ABI (`src/ffi.rs`, `include/rustify.h`) for iOS and anything else that is not a JVM. Built as a
# static library with `cargo rustc --crate-type staticlib` (tools/ios/build-core.sh) rather than by
# adding `staticlib` to crate-type, which would build an unused `.a` on every Android build too.
c-api = []
# The system's media controls on the desktop (src/media_controls.rs): SMTC on Windows, MPRIS on
# Linux, Now Playing on macOS. Separate from desktop-audio so a platform where it fails to build or
# register does not take the player down with it.
media-controls = ["dep:souvlaki"]

[dependencies]
# JNI bridge with Android
jni = { version = "0.22.4", default-features = false }

# High-performance asynchronous concurrency and threading.
# `net` since 3.2: the local streaming server binds a TcpListener (see src/server/).
# `time` since 3.3: stated rather than inherited from reqwest — `tokio::time::timeout` bounds the
# rustypipe calls, and a feature we rely on directly should be one we ask for directly.
tokio = { version = "1.40.0", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "net", "time"] }

# Local streaming server on 127.0.0.1 — lets Media3 play a plain http:// URL instead of needing a
# custom DataSource for the disk cache and for decryption. `reqwest` already pulls hyper 1.x, so
# the marginal size cost of the server half is small.
hyper = { version = "1.5", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

# Session token for that server. Unguessable matters: on Android any app can talk to localhost.
getrandom = "0.2"

# URL parsing for the addon security checks. Already in the tree via reqwest, so this costs nothing
# in binary size — and hand-parsing URLs on a security boundary is exactly where not to save a
# dependency.
url = "2.5"

# Ultra-efficient HTTP client with native/rustls TLS support
reqwest = { version = "0.12.7", default-features = false, features = ["json", "rustls-tls", "stream"] }

# The world's fastest JSON serializer/deserializer
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"

# To generate the anonymous Spotify TOTP at the byte level
totp-rs = { version = "5.5.1", features = ["gen_secret"] }

# URL encoding for Spotify search queries
urlencoding = "2.1.3"

# HTTP Basic auth headers. Was reqwest's `.basic_auth()` before the Env trait moved requests to
# plain data; a hand-rolled encoder is 15 lines nobody would test as hard as this crate is.
base64 = "0.22"

# Streaming response bodies (3.2). `Env::fetch_stream` hands back the body a chunk at a time so the
# local server can decrypt Deezer stripes as they arrive instead of downloading the whole track
# first. Already in the tree via `reqwest` and `hyper`, so declaring it costs nothing in binary size
# — it just stops us borrowing a transitive dependency by accident.
#
# No `futures-*`: the chunks travel through a `tokio::sync::mpsc` channel rather than a boxed
# `Stream`, because `http_body_util::BoxBody` requires `Send + Sync` and a boxed stream is not.
bytes = "1"

# Deezer stream decryption (3.1). Deezer serves tracks Blowfish/CBC-encrypted in 2048-byte stripes;
# this used to be Kotlin-only (`DeezerCrypto.kt`), which meant the Windows and iOS ports would each
# have had to write it again. Nobody should hand-roll a block cipher — the S-boxes alone are 4 KiB
# of constants — so the primitive comes from RustCrypto and the stripe scheme is ours.
blowfish = "0.9"
md-5 = "0.10"

# Fast regular expressions (used in spotify/client.rs for metadata cleaning)
regex = "1.10.6"

# YouTube / YouTube Music InnerTube client — handles n-param deobfuscation,
# stream URL extraction, search, and caching automatically.
# rustls-tls: avoid native system TLS (not reliably available on Android)
rustypipe = { version = "0.11", default-features = false, features = ["rustls-tls-webpki-roots"] }

# Brave's adblock-rust (MPL-2.0): parses EasyList / uBlock Origin filter syntax and answers network
# blocking queries. Used by the in-app Spotify Web Player, since Android's WebView cannot run
# browser extensions — we reuse uBO's filter LISTS instead of its runtime.
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
lofty = "0.25.5"
webpki-roots = "1.0.11"
chacha20poly1305 = "0.10"
hkdf = "0.12"
# Already in the tree through reqwest; Jam deflates its payloads with it.
flate2 = "1.1"
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls-no-provider"] }

# --- Desktop/iOS audio engine (features `engine` / `desktop-audio`) ---
# Pure Rust decoders: FLAC, MP3, AAC/ALAC in MP4, Vorbis in Ogg, WAV, and the Matroska/WebM container.
# No Opus decoder exists in Symphonia; see src/engine/decode.rs for how the desktop avoids needing one.
symphonia = { version = "0.5", optional = true, default-features = false, features = ["aac", "alac", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav"] }
# 0.15 on purpose: its API (`SampleRate(u32)`, `build_output_stream(.., None)`) is what
# src/engine/output.rs is written against. Moving to a newer one is a deliberate, tested change.
cpal = { version = "0.15", optional = true }
# One API over SMTC, MPRIS and MPNowPlayingInfoCenter. zbus rather than the default libdbus binding,
# so Linux builds need no system D-Bus headers (only libasound for cpal).
souvlaki = { version = "0.7", optional = true, default-features = false, features = ["use_zbus"] }

# --- Android only ---
[target.'cfg(target_os = "android")'.dependencies]
# Not used by a single line of our code, and not removable either: `rustypipe` pulls
# `rquickjs-sys` in transitively (for YouTube's n-parameter deobfuscation), and this declaration
# exists purely to turn its `bindgen` feature ON. Cargo unifies features across the graph, so that
# switch reaches rustypipe's copy and makes it GENERATE bindings for whichever Android ABI is being
# built rather than looking for pre-generated ones that do not exist for those targets.
#
# It is scoped to Android because the switch is only right there. On the host, bindgen wants
# libclang plus a full C toolchain, and pointing it at the NDK's clang does not work — that clang
# targets Android and cannot find the MSVC headers, which shows up as `stdio.h not found` in the
# middle of what looks like a test run. Left unscoped, `cargo test` on a developer machine could not
# build at all. Scoped, the host quietly uses the pre-generated bindings and never needs a C
# toolchain. See docs/17-testing-and-coverage.md.
rquickjs-sys = { version = "0.9.0", features = ["bindgen"] }

# --- iOS only ---
# The same switch for the same reason: rquickjs-sys ships no pre-generated bindings for
# aarch64-apple-ios or aarch64-apple-ios-sim (seen in CI: "couldn't find file
# src/bindings/aarch64-apple-ios.rs"). On a Mac bindgen finds Xcode's libclang, so nothing else is
# needed. Not used by `cargo ndk build`, so the APK is unchanged.
[target.'cfg(target_os = "ios")'.dependencies]
rquickjs-sys = { version = "0.9.0", features = ["bindgen"] }


# --- Optimizations for Android NDK (Reduces .so file size) ---
[profile.release]
# "s", not "z" (4.7.1). At "z" LLVM turns the loop vectoriser off: measured on a Snapdragon 8 Elite
# Gen 5, the audio lab's FFT ran 7-15x slower, Deezer decryption ~25% and JSON parsing 25-50% slower
# than at "s", for a .so only 3% smaller (8.65 vs 8.92 MB). The 4.7 check (C8) compared "z" with "3"
# on scalar code only, which is why it saw no difference.
opt-level = "s"
lto = true          # Link Time Optimization: removes dead code
codegen-units = 1   # Slower compilation, but smaller/faster binary
strip = true        # Strips debugging symbols

[dev-dependencies]
# One test needs to set a file's modification time, and `std` has no setter. Writing three files in
# a row and hoping the filesystem can tell them apart is how a cache-eviction test becomes flaky on
# whichever machine has one-second timestamp resolution.
filetime = "0.2"

# The end-to-end tests drive the engine through `MockEnv`, which only exists outside `cfg(test)`
# with this feature. Declared so a plain `cargo test` skips them instead of failing to compile them —
# which is what it did, and why these tests had never run. CI passes the feature.
[[test]]
name = "end_to_end"
required-features = ["mock-env"]

[build-dependencies]
# Compiles native/fft_kernels.c (the audio lab's ARM kernels); already in the tree through ring.
cc = "1"
