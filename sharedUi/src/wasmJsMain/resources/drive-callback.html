<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rustify</title>
<link rel="icon" href="icon-192.png" type="image/png">
</head>
<body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#121212;color:#eee;font:16px system-ui,sans-serif;text-align:center">
<div><h1>Rustify</h1><p>Google Drive &#10003;</p></div>
<script>
    // Google's answer for Drive (code and state, or an error), from the https redirect page: handed to
    // the Rustify tab that asked (WebDriveAuth), which checks the state. Then this tab closes.
    (function () {
        try {
            var channel = new BroadcastChannel('rustify-drive');
            channel.postMessage(location.search);
            channel.close();
        } catch (e) {}
        history.replaceState(null, '', location.pathname);
        setTimeout(function () { window.close(); }, 800);
    })();
</script>
</body></html>
